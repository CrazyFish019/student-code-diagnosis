name: Build Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = python -c "from core.version import __version__; print(__version__)"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$version"
          }
      - name: Run tests
        shell: pwsh
        run: python -m pytest -ra --basetemp="$env:RUNNER_TEMP\student-code-diagnosis-tests"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: StudentCodeDiagnosis-${{ github.ref_name }}
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/installer/*.exe dist/installer/*.sha256 --generate-notes --verify-tag
